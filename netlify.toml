# ---- Sharing ----
# Share cards. Drawn on demand, cached hard at the edge.
[[redirects]]
  from = "/og/*"
  to = "/.netlify/functions/og/:splat"
  status = 200

# Every address somebody might share individually is served by the page
# function, which returns the built app with that page's own title, blurb and
# card in the head. `/` is not in this list on purpose: its tags never change,
# so they sit in index.html and the front page stays a plain CDN hit.
#
# These must come before the catch-all below — Netlify takes the first rule
# that matches.
[[redirects]]
  from = "/chart"
  to = "/.netlify/functions/page/chart"
  status = 200

[[redirects]]
  from = "/chart/:id"
  to = "/.netlify/functions/page/chart/:id"
  status = 200

[[redirects]]
  from = "/story/:id"
  to = "/.netlify/functions/page/story/:id"
  status = 200

[[redirects]]
  from = "/market"
  to = "/.netlify/functions/page/market"
  status = 200

[[redirects]]
  from = "/market/:slug"
  to = "/.netlify/functions/page/market/:slug"
  status = 200

[[redirects]]
  from = "/strand/:key"
  to = "/.netlify/functions/page/strand/:key"
  status = 200

[[redirects]]
  from = "/exchange"
  to = "/.netlify/functions/page/exchange"
  status = 200

[[redirects]]
  from = "/watch"
  to = "/.netlify/functions/page/watch"
  status = 200

[[redirects]]
