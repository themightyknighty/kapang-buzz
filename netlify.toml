# Kapang Buzz — its own Netlify site.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # `dist/index.html` is the app as Vite just built it — the page function
  # serves that exact file with this page's preview tags spliced in, so a
  # shared link opens the real app rather than a stand-in. The build command
  # runs before functions are bundled, so it is there by the time this is read.
  included_files = ["pipeline/**", "market/**", "netlify/fonts/**", "dist/index.html"]
  # resvg is a native binary. Bundling it produces a function that loads on
  # nobody's machine, so it is installed rather than inlined.
  external_node_modules = ["@resvg/resvg-js"]

[functions."sync-schedule"]
  schedule = "0 0,13,19 * * *"

# The market runs on its own clock: one shard of the roster every 15 minutes,
# and a daily job at 03:00 UTC for Wikipedia, rollups, records and pruning.
[functions."market-schedule"]
  schedule = "*/15 * * * *"

[functions."market-daily"]
  schedule = "0 3 * * *"

# The Genie 100 goes out once a week and never changes afterwards. 13:00 UTC
# is 9am Eastern in summer, 8am in winter — Netlify's scheduler speaks only
# UTC, and the news schedule already drifts the same way.
[functions."chart-weekly"]
  schedule = "0 13 * * 1"

[[redirects]]
  from = "/api/feed"
  to = "/.netlify/functions/feed"
  status = 200

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200

[[redirects]]
